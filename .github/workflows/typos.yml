name: Typos

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typos:
    name: Check spelling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check spelling
        uses: crate-ci/typos@v1.50.2
        with:
          config: ./_typos.toml
